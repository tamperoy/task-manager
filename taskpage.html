<!DOCTYPE html>
<html>

<head>
    <title>create a task on Taskly</title>
    <link rel="stylesheet" href="general.css">
    <link rel="stylesheet" href="taskpage.css">
</head>

<body>
    <div class="right-panel">
        <div class="new-task-card">
            <div class="form-title">
                <h2>New task</h2>
                <button type="button" aria-label="Close form">×</button>
            </div>

            <div>
                <label for="task-title">Title <span>*</span></label>
                <input id="task-title" type="text" placeholder="What needs to get done?">

                <label for="task-description">Description</label>
                <textarea id="task-description" placeholder="Add a few details..."></textarea>

                <label for="task-category">Category</label>
                <select id="task-category">
                    <option>Work</option>
                    <option>Study</option>
                    <option>Personal</option>
                </select>

                <label for="task-status">Status</label>
                <select id="task-status">
                    <option>Pending</option>
                    <option>Completed</option>
                </select>

                <div class="form-buttons">
                    <button class="cancel-button" type="button">Cancel</button>
                    <button class="blue-button" type="button">Create task</button>
                </div>
            </div>
        </div>
    </div>
</body>

</html>
