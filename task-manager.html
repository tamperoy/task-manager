<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Task Manager</title>
    <link rel="stylesheet" href="general.css">
    <link rel="stylesheet" href="task-manager-sidebar.css">
    <link rel="stylesheet" href="task-manager-header.css">
    <link rel="stylesheet" href="task-manager-main.css">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,100..900;1,100..900&display=swap"
        rel="stylesheet">
</head>

<body>
    <div>
        <div class="sidebar">
            <div class="top-section">
                <img src="images/taskly-logo.png">
                <p class="grey-text">Workspace</p>
                <button class="icon-button">
                    <img class="icon" src="images/my-task-icon.png">My Task</button>
            </div>

            <div class="bottom-section">
                <div class="bottom-section-text">
                    <p class="grey-text">A little progress, Every day.</p>
                </div>
                <div class="user-controller">
                    <button class="user">temp account</button>
                    <button class="log-out">Log out</button>
                </div>
            </div>
        </div>

        <div class="header">
            <div class="header-box">
                <div class="left-section">
                    <p class="grey-text">Your workspace</p>
                    <p class="big-text">My tasks</p>
                    <p class="grey-text">A clear space for everything you need to do</p>
                </div>
                <div class="right-section">
                    <button class="new-task-button"> &#43 New task</button>
                </div>
            </div>
            <div class="task-numbers">
                <div class="task-div">
                    <img class="task-div-img" src="images/total-tasks-icon.png">
                    <p>Total Task</p>
                </div>
                <div class="task-div">
                    <img class="task-div-img" src="images/pending-icon.png">
                    <p>pending</p>
                </div>
                <div class="task-div">
                    <img class="task-div-img" src="images/completed-tasks.png">
                    <p>completed</p>
                </div>
            </div>
        </div>


        <div class="main box">

        </div>
    </div>
</body>

</html>
