<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Taskly</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="general.css">
    <link rel="stylesheet" href="sidebar.css">
    <link rel="stylesheet" href="header.css">
    <link rel="stylesheet" href="main.css">
</head>

<body>
    <div class="page">

        <div class="sidebar">
            <div>
                <div class="logo">
                    <span class="logo-box">✓</span>
                    <span>Taskly</span>
                </div>

                <p class="small-heading">WORKSPACE</p>

                <button class="menu-item active" type="button">
                    <span class="menu-icon">▣</span>
                    My tasks
                </button>
            </div>

            <div class="sidebar-bottom">
                <p class="motto">A little progress, every day.</p>

                <div class="user">
                    <div class="avatar">AL</div>
                    <span>Alex Lee</span>
                </div>

                <button class="logout" type="button">↪ &nbsp; Log out</button>
            </div>
        </div>

        <div class="content">
            <div class="page-header">
                <div>
                    <p class="small-heading">YOUR WORKSPACE</p>
                    <h1>My tasks</h1>
                    <p class="subtitle">A clear space for everything you need to do.</p>
                </div>
                <a href="taskpage.html">
                    <button class="blue-button" type="button">＋ &nbsp; New task</button>
                </a>

            </div>

            <div class="summary">
                <div class="summary-card">
                    <div class="summary-icon blue-icon">▤</div>
                    <div>
                        <p>Total tasks</p>
                        <strong>6</strong>
                    </div>
                </div>

                <div class="summary-card">
                    <div class="summary-icon yellow-icon">◷</div>
                    <div>
                        <p>Pending</p>
                        <strong>4</strong>
                    </div>
                </div>

                <div class="summary-card">
                    <div class="summary-icon green-icon">✓</div>
                    <div>
                        <p>Completed</p>
                        <strong>2</strong>
                    </div>
                </div>
            </div>

            <div class="tasks">
                <div class="task-tools">
                    <div class="tabs">
                        <button class="tab selected" type="button">All tasks <span>6</span></button>
                        <button class="tab" type="button">Pending <span>4</span></button>
                        <button class="tab" type="button">Completed <span>2</span></button>
                    </div>

                    <select class="category-filter" aria-label="Filter by category">
                        <option>All categories</option>
                        <option>Work</option>
                        <option>Study</option>
                        <option>Personal</option>
                    </select>
                </div>
            </div>
        </div>


    </div>
</body>

</html>
